# =============================================================================
# Bootstrap Hosts Template
# =============================================================================
# Copy this file to hosts.yml and fill in your actual values.
# hosts.yml is gitignored and contains secrets — never commit it.
# =============================================================================

hosts:
  # ---------------------------------------------------------------------------
  # Define one entry per remote host you want to bootstrap SSH access for.
  # ---------------------------------------------------------------------------
  - name: my-vps                      # Friendly label (used in log output)
    host: 192.168.1.100               # IP address or hostname
    port: 22                          # SSH port (default: 22)

    # -- Initial access (how to reach the host the FIRST time) ----------------
    initial_user: root                # User that currently exists on the host
    use_password: true                # Set true if the host only accepts a password
    password: ""                      # Leave empty to be prompted at runtime

    # Optional: Password to SET on the remote host for root / initial_user.
    # Useful when a fresh VPS provider gives you key-only access without a root password,
    # or you want to establish an initial root password during bootstrap.
    # Leave empty to skip password change.
    set_password: ""                  # e.g. "MyInitialRootPass123!"

    # -- SSH key to generate / use --------------------------------------------
    # generate: true  → create a new key pair (uses type/bits/comment/name options)
    # generate: false → use an existing key; supply ONE of:
    #   existing_path  path to your private key (public key = existing_path + .pub)
    #   public_key     raw public key string to authorize directly (no private key needed locally)
    key:
      generate: true
      overwrite: false                # true → force overwrite existing local key file if it exists
      type: ed25519                   # ed25519 | rsa | ecdsa
      bits: 4096                      # Only used for rsa keys
      comment: "ansible@my-vps"       # Embedded comment inside the key
      # Key name options (pick ONE of the two below):
      use_default_name: false         # true  → saves as ~/.ssh/id_<type>
      custom_name: "my-vps"          # false → saves as ~/.ssh/my-vps
      passphrase: ""                  # Leave empty for no passphrase

      # -- Used only when generate: false --------------------------------------
      existing_path: ""               # e.g. ~/.ssh/id_ed25519  (private key path)
      public_key: ""                  # e.g. "ssh-ed25519 AAAA... user@host"

    # -- Remote user to authorize the key for ---------------------------------
    # If initial_user is root and authorize_for_user is a non-root user (e.g. debian):
    # The script will connect as initial_user, create the authorize_for_user with sudo rights,
    # deploy the SSH key to authorize_for_user, verify SSH login as authorize_for_user,
    # and remove the deployed key from root's authorized_keys.
    authorize_for_user: debian        # Which user on the remote host gets the key
    delete_root_authorized_keys: true # Delete deployed key from root's authorized_keys after switch
