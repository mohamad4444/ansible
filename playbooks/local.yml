---
- hosts: localhost
  connection: local
  become: true
  vars:
    ansible_user: "{{ lookup('env', 'USER') }}"
  pre_tasks:
    - name: Read project version
      ansible.builtin.set_fact:
        project_version: "{{ lookup('file', '../VERSION') }}"
      check_mode: false

    - name: Display project version
      ansible.builtin.debug:
        msg: "Running Ansible Project Version: {{ project_version }}"

  roles:
    - preflight # Update system packages first
    - common # Base packages and utilities
    - role: docker # Docker installation (must be before users role)
      when: features.docker
    - role: users # Create system users (depends on docker group)
      when: features.docker
    - role: k8s # Kubernetes tools
      when: features.kubernetes
    - role: devops_tools # GitOps and DevOps tools
      when: devtools
    - role: cloud # Cloud provider tools
      when: features.cloud
    - environment # Configure shell environment last