
---
- name: Update CLI tool versions
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    github_tools:
      helm: helm/helm
      helmfile: helmfile/helmfile
      stern: stern/stern
      kustomize: kubernetes-sigs/kustomize
      k9s: derailed/k9s
      terraform: hashicorp/terraform
      vault: hashicorp/vault
      jq: jqlang/jq
      yq: mikefarah/yq

    output_file: "{{ playbook_dir }}/../vars/versions.auto.yml"

  tasks:
    - name: Fetch latest GitHub releases
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ item.value }}/releases/latest"
        headers:
          Accept: application/vnd.github+json
        return_content: true
        status_code: 200
      loop: "{{ github_tools | dict2items }}"
      register: releases
      changed_when: false

    - name: Build versions dictionary
      ansible.builtin.set_fact:
        tool_versions: >-
          {{
            tool_versions | default({}) |
            combine({
              item.item.key:
              (item.json.tag_name | regex_replace('^v', ''))
            })
          }}
      loop: "{{ releases.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Write versions file
      ansible.builtin.copy:
        dest: "{{ output_file }}"
        content: |
          ---
          {{ {'tool_versions': tool_versions} | to_nice_yaml(sort_keys=True) }}
        mode: '0644'
