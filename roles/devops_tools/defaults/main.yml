# Default enabled tools
devops_tools_enabled:
  - awscli
  - terraform
  - vault
  - helm
  - helmfile
  - kubectl
  - kustomize
  - k9s
  - tilt
  - stern
  - kubeseal
  - sops
  - dive
  - lazydocker
  - hadolint
  - trivy
  - ansible_lint
  - common_packages
  - kluctl
  - argocd
  - kubectx
  - skaffold
  - talosctl

# Disabled by default
# - minikube
# - sonobuoy
# - ytt
# - goss
# - checkov
# - molecule
# - testinfra

# Architecture mapping
architecture: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"

# GitOps tool versions
stern_version: "1.28.0"
k9s_version: "0.31.9"
kubectx_version: "0.9.5"
talosctl_version: "1.6.6"
helm_version: "3.14.2"
helmfile_version: "0.162.0"
kluctl_version: "2.23.3"
kustomize_version: "5.3.0"
tilt_version: "0.33.11"
argocd_version: "2.10.1"
