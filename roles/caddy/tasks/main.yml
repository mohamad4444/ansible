---
- name: Install Docker and Git
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - git
    state: present
    update_cache: true

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Check caddy_net network
  ansible.builtin.command:
    cmd: docker network inspect caddy_net
  register: caddy_net_check
  changed_when: false
  failed_when: false

- name: Create caddy_net network
  ansible.builtin.command:
    cmd: docker network create caddy_net
  when: caddy_net_check.rc != 0

- name: Ensure Caddy data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
  loop:
    - "{{ infrastructure_dir }}/data/caddy_data"
    - "{{ infrastructure_dir }}/data/caddy_config"
  loop_control:
    label: "{{ item | basename }}"

- name: Deploy Caddyfile
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../files/infrastructure/Caddyfile.j2"
    dest: "{{ infrastructure_dir }}/Caddyfile"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
  notify: Reload Caddy

# The app source used to be copied here from apps/portfolio/. Git cannot clone
# into a non-empty directory, so drop that legacy tree before the first clone.
- name: Check whether portfolio source is already a git checkout
  ansible.builtin.stat:
    path: "{{ portfolio_dir }}/.git"
  register: portfolio_git_check

- name: Remove legacy copied portfolio source
  ansible.builtin.file:
    path: "{{ portfolio_dir }}"
    state: absent
  when: not portfolio_git_check.stat.exists

# The app source is no longer vendored in this repo; clone it directly on the VPS.
- name: Deploy portfolio source from GitHub
  ansible.builtin.git:
    repo: "{{ portfolio_repo }}"
    dest: "{{ portfolio_dir }}"
    version: "{{ portfolio_version }}"
    force: true
  register: portfolio_checkout

- name: Build and start portfolio
  ansible.builtin.command:
    cmd: "{{ docker_compose_cmd }} up -d --build"
    chdir: "{{ portfolio_dir }}"
  register: portfolio_compose
  changed_when: portfolio_checkout.changed or portfolio_compose.stdout | length > 0
