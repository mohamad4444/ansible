---
- name: Install essential system packages on Debian
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Install essential system packages on Arch Linux
  community.general.pacman:
    name: "{{ common_packages_arch }}"
    state: present
    update_cache: yes
  when: ansible_os_family == "Archlinux"
